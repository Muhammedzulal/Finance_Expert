name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-contracts.txt
      - run: python -m pip install -r requirements-contracts.txt
      - run: python tools/validate_contracts.py
      - run: python ai/test_worker.py

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-test.txt
            backend/requirements.compose.txt
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m pytest backend/tests tests/test_adapters_and_transfer.py -q

  flutter-analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/finance_expert
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.6'
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Flutter analyze
        run: |
          set +e
          flutter analyze --fatal-infos --fatal-warnings > "$RUNNER_TEMP/flutter-analyze.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/flutter-analyze.log"
          if [ "$result" -ne 0 ]; then
            while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              echo "::error::$line"
            done < "$RUNNER_TEMP/flutter-analyze.log"
          fi
          exit "$result"
